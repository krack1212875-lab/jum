<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="description" content="질문 7개에 답하면 점심 메뉴 하나를 골라주는 사이트">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffb454'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%2314161b'/%3E%3C/svg%3E">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>오늘 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  /* 레이아웃: 한 컬럼. 질문은 왼쪽 정렬로 위에서 아래로 흐르고, 결과는 식당 주문표 모양의 카드 하나로 끝난다. */
  --bg: #14161b;
  --surface: #1c1f26;
  --surface-2: #262a33;
  --line: #343a47;
  --fg: #ecebe6;
  --muted: #9aa1ad;
  --accent: #ffb454;
  --accent-ink: #1b1306;
  --teal: #7fd1bf;
  --font-display: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: 0.875rem; letter-spacing: 0.04em; }
.brand strong { font-family: var(--font-display); font-weight: 400; font-size: 1.125rem; color: var(--fg); letter-spacing: 0; }
.brand .clock { font-variant-numeric: tabular-nums; }

h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); }

/* intro */
.intro { display: flex; flex-direction: column; gap: 24px; padding-top: 8px; }
.intro h1 { font-size: clamp(2.75rem, 12vw, 4.25rem); line-height: 1.08; }
.intro h1 em { font-style: normal; color: var(--accent); }
.intro p { margin: 0; color: var(--muted); font-size: 1.0625rem; max-width: 34ch; }
.cta {
  align-self: flex-start;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 10px;
  padding: 14px 28px; font-weight: 700; font-size: 1.0625rem;
  cursor: pointer; min-height: 52px;
  transition: transform 0.12s ease;
}
.cta:hover { transform: translateY(-1px); }
.cta:active { transform: translateY(0); }
.count { color: var(--muted); font-size: 0.875rem; }

/* quiz */
.quiz { display: flex; flex-direction: column; gap: 24px; }
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.progress span { height: 4px; border-radius: 2px; background: var(--line); transition: background 0.2s ease; }
.progress span.done { background: var(--accent); }
.qmeta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 0; min-height: 40px; }
.back:hover { color: var(--fg); }
.quiz h2 { font-size: clamp(1.875rem, 7vw, 2.5rem); line-height: 1.25; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; min-height: 58px; font-size: 1.0625rem;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); }
.key {
  flex: none; display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--surface-2); color: var(--muted);
  font-size: 0.8125rem; font-variant-numeric: tabular-nums;
}
.opt[aria-pressed="true"] .key { background: var(--accent); color: var(--accent-ink); }
.hint { color: var(--muted); font-size: 0.8125rem; margin: 0; }

/* result: 주문표 */
.result { display: flex; flex-direction: column; gap: 28px; }
.ticket {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  --pad: 22px;
  padding: var(--pad);
  display: flex; flex-direction: column; gap: 14px;
}
.ticket-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 0.8125rem; letter-spacing: 0.08em; }
.ticket-head .rank { color: var(--accent); font-weight: 700; }
.ticket h2 { font-size: clamp(2rem, 8vw, 2.875rem); line-height: 1.15; }
.hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.hero-text { flex: 1 1 170px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tile {
  flex: none; display: grid; place-items: center;
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  background: linear-gradient(160deg, #2a2733, #1b1a22);
}
.tile svg { width: 80%; height: 80%; display: block; }
.tile.lg { width: 112px; height: 112px; border-radius: 26px; animation: pop 0.35s ease-out both; }
.tile.sm { width: 44px; height: 44px; border-radius: 12px; }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
.ticket .desc { margin: 0; color: var(--muted); }
.perf { position: relative; border-top: 2px dashed var(--line); margin: 10px calc(-1 * var(--pad)); }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line);
}
.perf::before { left: -11px; }
.perf::after { right: -11px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; margin: 0; }
.stats div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats dt { color: var(--muted); font-size: 0.8125rem; }
.stats dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.why h3 { font-family: var(--font-body); font-size: 0.8125rem; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 10px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { border: 1px solid var(--teal); color: var(--teal); border-radius: 999px; padding: 4px 12px; font-size: 0.875rem; }
.chips li.plain { border-color: var(--line); color: var(--muted); }

.alt { display: flex; flex-direction: column; gap: 10px; }
.alt h3 { font-family: var(--font-body); font-size: 0.875rem; color: var(--muted); }
.alt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alt-btn {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: transparent; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 16px 8px 8px; min-height: 60px; cursor: pointer; text-align: left;
  transition: border-color 0.15s ease;
}
.alt-btn:hover { border-color: var(--accent); }
.alt-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
.alt-btn .p { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; flex: none; }
.restart { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; cursor: pointer; min-height: 48px; }
.restart:hover { border-color: var(--accent); }
.learn { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.learn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.learn-label { color: var(--teal); font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.08em; }
.learn-note { color: var(--muted); font-size: 0.8125rem; }
.learn-sum { margin: 0; line-height: 1.7; }
.learn-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.learn-btn { background: none; border: 1px solid var(--teal); color: var(--teal); border-radius: 999px; padding: 8px 18px; min-height: 40px; cursor: pointer; font-size: 0.9375rem; }
.learn-btn:hover:not(:disabled) { background: var(--surface-2); }
.learn-btn:disabled { opacity: 0.5; cursor: default; }
.learn-reset { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 4px; min-height: 40px; font-size: 0.875rem; text-decoration: underline; }
.learn-msg { margin: 0; color: var(--muted); font-size: 0.875rem; }
.learn-msg:empty { display: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

</head>
<body>
<main class="wrap">
  <div class="brand">
    <strong>오늘 뭐 먹지</strong>
    <span class="clock">12:00 점심</span>
  </div>

  <section id="intro" class="intro">
    <h1>오늘 점심,<br><em>뭐 먹지?</em></h1>
    <p>질문 7개에 답하면 메뉴 하나를 골라드려요. 1분이면 끝나요.</p>
    <button type="button" class="cta" id="start">시작하기</button>
    <span class="count" id="count">메뉴 55가지 중에서 골라요</span>
  </section>

  <section id="quiz" class="quiz" hidden>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="qmeta">
      <span id="q-count">1 / 7</span>
      <button type="button" class="back" id="back">이전</button>
    </div>
    <h2 id="q-title" tabindex="-1"></h2>
    <ul class="opts" id="opts"></ul>
    <p class="hint">키보드 숫자키로도 고를 수 있어요.</p>
  </section>

  <section id="result" class="result" hidden>
    <article class="ticket">
      <div class="ticket-head"><span id="r-kind">오늘의 점심</span><span class="rank" id="r-rank">추천 1순위</span></div>
      <div class="hero">
        <div class="tile lg" id="r-icon" aria-hidden="true"></div>
        <div class="hero-text">
          <h2 id="r-name" tabindex="-1"></h2>
          <p class="desc" id="r-desc"></p>
        </div>
      </div>
      <div class="perf"></div>
      <dl class="stats">
        <div><dt>가격</dt><dd id="r-price"></dd></div>
        <div><dt>식사 시간</dt><dd id="r-time"></dd></div>
        <div><dt>맵기</dt><dd id="r-spicy"></dd></div>
        <div><dt>양</dt><dd id="r-size"></dd></div>
      </dl>
      <div class="perf"></div>
      <div class="why">
        <h3>골라진 이유</h3>
        <ul class="chips" id="r-why"></ul>
      </div>
    </article>
    <div class="learn">
      <div class="learn-head">
        <span class="learn-label">내 입맛 AI</span>
        <span class="learn-note">이 브라우저 안에서만 배워요</span>
      </div>
      <p class="learn-sum" id="learn-sum"></p>
      <div class="learn-actions">
        <button type="button" class="learn-btn" id="learn-yes">이걸로 갈게요</button>
        <button type="button" class="learn-btn" id="learn-no">별로예요</button>
        <button type="button" class="learn-reset" id="learn-reset" hidden>기록 지우기</button>
      </div>
      <p class="learn-msg" id="learn-msg" aria-live="polite"></p>
    </div>
    <div class="alt">
      <h3>이 메뉴도 어울려요</h3>
      <ul class="alt-list" id="alt-list"></ul>
    </div>
    <button type="button" class="restart" id="restart">처음부터 다시</button>
  </section>
</main>

/* 내 입맛 AI: 좋아요, 별로예요를 누를 때마다 메뉴의 특징별 가중치를 조금씩 고친다.
   서버나 Claude를 쓰지 않고 이 페이지 안에서만 계산한다. */
const TASTE = { w: {}, b: {}, n: 0 };
const FEAT_LABEL = {
  'k:K': '한식', 'k:C': '중식', 'k:J': '일식', 'k:W': '양식',
  cold: '시원한 음식', warm: '따뜻한 음식', greasy: '기름진 음식', lite: '담백한 음식',
  soup: '국물 요리', dry: '국물 없는 요리',
  'c:rice': '밥 메뉴', 'c:noodle': '면 요리', 'c:other': '빵이나 분식',
  'pr:meat': '고기', 'pr:sea': '해산물', 'pr:veg': '채소 위주',
  'h:3': '든든한 양', 'h:1': '가벼운 양', 'sp:2': '매운맛', 'sp:0': '순한 맛',
  't:0': '7천 원 이하', 't:2': '1만 2천 원 이상'
};
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
function feats(m) {
  return ['k:' + m.k, m.cold ? 'cold' : 'warm', m.g ? 'greasy' : 'lite', m.so ? 'soup' : 'dry',
    'c:' + (m.c === 'rice' || m.c === 'noodle' ? m.c : 'other'), 'pr:' + m.pr, 'h:' + m.h, 'sp:' + m.sp, 't:' + tier(m)];
}
function tasteBonus(m) {
  let sum = 0;
  feats(m).forEach(f => { sum += TASTE.w[f] || 0; });
  return clamp(sum * 0.25 + (TASTE.b[m.n] || 0), -5, 5);
}
function learn(m, y) {
  feats(m).forEach(f => { TASTE.w[f] = clamp((TASTE.w[f] || 0) + 0.5 * y, -3, 3); });
  TASTE.b[m.n] = clamp((TASTE.b[m.n] || 0) + 1.0 * y, -4, 4);
  TASTE.n += 1;
}
function tasteSummary() {
  const arr = Object.keys(TASTE.w).filter(k => FEAT_LABEL[k]).map(k => [k, TASTE.w[k]]);
  const likes = arr.filter(x => x[1] >= 0.5).sort((p, q) => q[1] - p[1]).slice(0, 3).map(x => FEAT_LABEL[x[0]]);
  const dislikes = arr.filter(x => x[1] <= -0.5).sort((p, q) => p[1] - q[1]).slice(0, 2).map(x => FEAT_LABEL[x[0]]);
  return { likes: likes, dislikes: dislikes };
}

/* 모든 메뉴에 점수를 매겨 높은 순으로 돌려준다. 동점이 많아서 약간의 무작위를 섞는다. */
function rank(answers) {
  return M.map(m => {
    let score = 0;
    const contrib = [];
    answers.forEach((a, qi) => {
      const o = Q[qi].o[a];
      const v = o.f(m);
      score += v;
      if (o.r && v >= 2) contrib.push({ v: v, r: o.r });
    });
    const bonus = tasteBonus(m);
    if (bonus >= 1.5) contrib.push({ v: bonus, r: '내 입맛 학습 반영' });
    return { m: m, score: score + bonus + Math.random() * 0.8, contrib: contrib.sort((x, y) => y.v - x.v) };
  }).sort((x, y) => y.score - x.score);
}

function dishIcon(m) {
  const spec = ICON[m.n] || ['soup', { b: ['#e8bf7f', '#c38a45'], n: '#f4d27a' }];
  const o = spec[1] || {};
  const p = painter();
  const body = DRAW[spec[0]](p, o);
  const tint = (o.b && o.b[0]) || (o.t && o.t[0]) || (o.s && o.s[0]) || (o.c && o.c[0]) || TINT[spec[0]] || '#ffb454';
  return { svg: p.svg(body), bg: 'radial-gradient(circle at 30% 18%, ' + tint + '55 0%, transparent 70%), linear-gradient(160deg, #2a2733, #1b1a22)' };
}

/*UI*/
const $ = id => document.getElementById(id);
let qi = 0, answers = [], ranked = [], sel = 0, locked = false;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function show(name) {
  ['intro', 'quiz', 'result'].forEach(id => { $(id).hidden = id !== name; });
  window.scrollTo(0, 0);
}

function renderQ() {
  const q = Q[qi];
  locked = false;
  $('q-count').textContent = (qi + 1) + ' / ' + Q.length;
  const prog = $('progress');
  prog.innerHTML = '';
  prog.style.gridTemplateColumns = 'repeat(' + Q.length + ', 1fr)';
  Q.forEach((_, i) => {
    const s = document.createElement('span');
    if (i <= qi) s.className = 'done';
    prog.appendChild(s);
  });
  $('q-title').textContent = q.q;
  const list = $('opts');
  list.innerHTML = '';
  q.o.forEach((o, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('aria-pressed', answers[qi] === i ? 'true' : 'false');
    const k = document.createElement('span');
    k.className = 'key';
    k.textContent = String(i + 1);
    const t = document.createElement('span');
    t.textContent = o.t;
    b.appendChild(k);
    b.appendChild(t);
    b.addEventListener('click', () => pick(i));
    li.appendChild(b);
    list.appendChild(li);
  });
  $('q-title').focus({ preventScroll: true });
}

function pick(i) {
  if (locked) return;
  locked = true;
  answers[qi] = i;
  Array.prototype.forEach.call($('opts').querySelectorAll('.opt'), (b, j) => {
    b.setAttribute('aria-pressed', j === i ? 'true' : 'false');
  });
  setTimeout(() => {
    if (qi < Q.length - 1) { qi++; renderQ(); } else { finish(); }
  }, reduce ? 0 : 220);
}

function begin() {
  qi = 0;
  answers = [];
  renderQ();
  show('quiz');
}

function finish() {
  ranked = rank(answers);
  sel = 0;
  renderResult();
  show('result');
  $('r-name').focus({ preventScroll: true });
}

function renderResult() {
  const r = ranked[sel];
  const m = r.m;
  $('r-kind').textContent = '오늘의 점심 · ' + KIND[m.k];
  $('r-rank').textContent = '추천 ' + (sel + 1) + '순위';
  $('r-name').textContent = m.n;
  const ic = dishIcon(m);
  const iconEl = $('r-icon');
  iconEl.innerHTML = ic.svg;
  iconEl.style.background = ic.bg;
  iconEl.style.animation = 'none';
  void iconEl.offsetWidth;
  iconEl.style.animation = '';
  renderLearn();
  $('r-desc').textContent = m.d;
  $('r-price').textContent = '₩' + m.p.toLocaleString('ko-KR') + ' 안팎';
  $('r-time').textContent = '약 ' + m.t + '분';
  $('r-spicy').textContent = ['맵지 않음', '살짝 매콤', '확실히 매움'][m.sp];
  $('r-size').textContent = ['', '가벼운 양', '보통 양', '든든한 양'][m.h];

  const why = $('r-why');
  why.innerHTML = '';
  const seen = {};
  const reasons = r.contrib.filter(c => seen[c.r] ? false : (seen[c.r] = true)).slice(0, 4);
  if (reasons.length === 0) {
    const li = document.createElement('li');
    li.className = 'plain';
    li.textContent = '고른 조건과 크게 어긋나는 점이 없어요';
    why.appendChild(li);
  } else {
    reasons.forEach(c => {
      const li = document.createElement('li');
      li.textContent = c.r;
      why.appendChild(li);
    });
  }

  const alt = $('alt-list');
  alt.innerHTML = '';
  ranked.slice(0, 4).forEach((x, i) => {
    if (i === sel) return;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'alt-btn';
    const n = document.createElement('span');
    n.className = 'alt-name';
    const tl = document.createElement('span');
    tl.className = 'tile sm';
    const ai = dishIcon(x.m);
    tl.innerHTML = ai.svg;
    tl.style.background = ai.bg;
    const nm = document.createElement('span');
    nm.textContent = x.m.n;
    n.appendChild(tl);
    n.appendChild(nm);
    const p = document.createElement('span');
    p.className = 'p';
    p.textContent = '₩' + x.m.p.toLocaleString('ko-KR');
    b.appendChild(n);
    b.appendChild(p);
    b.addEventListener('click', () => { sel = i; renderResult(); window.scrollTo(0, 0); });
    li.appendChild(b);
    alt.appendChild(li);
  });
}

$('count').textContent = '메뉴 ' + M.length + '가지 중에서 골라요';
$('start').addEventListener('click', begin);
$('restart').addEventListener('click', begin);
$('back').addEventListener('click', () => {
  if (qi === 0) { show('intro'); } else { qi--; renderQ(); }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $('quiz').hidden) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= Q[qi].o.length) { e.preventDefault(); pick(n - 1); }
});
/* 내 입맛 AI 화면: 기록은 이 브라우저에만 저장한다. 저장이 막혀 있어도 이번 방문 동안은 동작한다. */
const TASTE_KEY = 'lunch-taste-v1';
function loadTaste() {
  try {
    const raw = localStorage.getItem(TASTE_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.w && o.b) { TASTE.w = o.w; TASTE.b = o.b; TASTE.n = o.n || 0; }
  } catch (e) { /* 저장된 기록을 읽지 못하면 새로 시작한다 */ }
}
function saveTaste() {
  try { localStorage.setItem(TASTE_KEY, JSON.stringify(TASTE)); } catch (e) { /* 저장이 막혀 있으면 넘어간다 */ }
}
function updateSummary() {
  const t = tasteSummary();
  let line = '';
  if (TASTE.n === 0) {
    line = '아직 배운 게 없어요. 추천이 어땠는지 알려주면 입맛을 기억해서 다음 추천에 반영해요.';
  } else {
    line = TASTE.n + '번 배웠어요.';
    if (t.likes.length) line += ' 좋아하는 쪽은 ' + t.likes.join(', ') + '.';
    if (t.dislikes.length) line += ' 피하는 쪽은 ' + t.dislikes.join(', ') + '.';
  }
  $('learn-sum').textContent = line;
  $('learn-reset').hidden = TASTE.n === 0;
}
function renderLearn() {
  updateSummary();
  $('learn-msg').textContent = '';
  $('learn-yes').disabled = false;
  $('learn-no').disabled = false;
}
$('learn-yes').addEventListener('click', () => {
  learn(ranked[sel].m, 1);
  saveTaste();
  updateSummary();
  $('learn-yes').disabled = true;
  $('learn-no').disabled = true;
  $('learn-msg').textContent = '기억했어요. 다음 추천부터 반영돼요.';
});
$('learn-no').addEventListener('click', () => {
  const prev = ranked[sel].m;
  learn(prev, -1);
  saveTaste();
  ranked = rank(answers);
  sel = ranked[0].m === prev ? 1 : 0;
  renderResult();
  window.scrollTo(0, 0);
  $('learn-msg').textContent = '기억했어요. 다른 메뉴로 바꿨어요.';
});
$('learn-reset').addEventListener('click', () => {
  TASTE.w = {};
  TASTE.b = {};
  TASTE.n = 0;
  saveTaste();
  updateSummary();
  $('learn-msg').textContent = '입맛 기록을 지웠어요.';
});
loadTaste();
</script>
</body>
